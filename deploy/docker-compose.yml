# SEHATI — produksi satu VPS: Postgres + API + Caddy (HTTPS otomatis).
# Jalankan dari folder deploy/:  docker compose up -d
name: sehati

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sehati
      POSTGRES_USER: sehati
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sehati -d sehati"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ../server
    image: sehati-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, web]
    # Port API tidak dibuka ke internet; hanya Caddy yang mengaksesnya.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN wajib diisi di .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv/web:ro
      - ./download:/srv/download:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    networks: [web]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  internal:
  web:
