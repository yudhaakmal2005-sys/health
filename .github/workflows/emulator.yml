name: Emulator smoke
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/emulator.yml", ".github/scripts/**", "app/src/androidTest/**"]
permissions:
  contents: write
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: smoke-out
      - name: Ringkasan hasil
        if: always()
        run: |
          echo "=== SHOTS: $(ls smoke-out/shots 2>/dev/null | wc -l) ==="
          grep -E "FATAL EXCEPTION" -A14 smoke-out/logcat.txt | head -40
          grep -E "^e: |FAILED|AssertionError|Exception|ComposeTimeout|Tests? " smoke-out/connected.log | sort -u | head -30
          tail -n 6 smoke-out/connected.log

      - name: Publikasikan screenshot ke branch emulator-shots
        if: always()
        run: |
          [ -d smoke-out/shots ] || exit 0
          rm -rf /tmp/shots && mkdir -p /tmp/shots && cp smoke-out/shots/*.png /tmp/shots/
          cd /tmp/shots && git init -q && git checkout -q -b emulator-shots
          git config user.email ci@sehati.invalid && git config user.name sehati-ci
          git add -A && git commit -qm "screenshots ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" emulator-shots
