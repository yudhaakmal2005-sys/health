name: Android CI
on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          set +e
          timeout 18m ./gradlew --no-daemon --console=plain --continue testDebugUnitTest assembleDebug assembleStaging assembleRelease > build.log 2>&1
          echo $? > build.code
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            build.log
      - uses: actions/upload-artifact@v4
        with:
          name: sehati-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: sehati-staging-apk
          path: app/build/outputs/apk/staging/*.apk
          if-no-files-found: warn
      - name: Summary
        run: |
          code=$(cat build.code)
          echo "=== GRADLE EXIT CODE: $code ==="
          echo "--- last build.log lines ---"; tail -n 12 build.log
          grep -E "^e: |What went wrong|Execution failed|Could not " -A2 build.log | grep -v "^\s*at " | head -70
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=0
          for p in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              r=ET.parse(p).getroot()
              for c in r.iter('testcase'):
                  t+=1
                  for k in c.findall('failure')+c.findall('error'):
                      f+=1; print('TEST FAIL', c.get('classname'), c.get('name'), (k.get('message') or '')[:160])
                      for ln in [l for l in (k.text or '').splitlines() if 'Caused by' in l or 'at id.sehati' in l][:6]: print('    ', ln.strip()[:200])
          print('TESTS', t, 'FAILED', f)
          PY
          [ "$code" = "0" ]
