<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SEHATI — pencegahan penyakit jantung koroner berbasis Posyandu untuk warga, kader, dan Puskesmas. Bekerja tanpa internet, menjaga privasi." />
    <meta name="theme-color" content="#0284C7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SEHATI — Jantung Sehat dari Desa</title>
    <script>
      // Terapkan tema sebelum render pertama agar tidak berkedip.
      (function () {
        try {
          var p = localStorage.getItem('sehati-theme');
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>SEHATI memerlukan JavaScript untuk menampilkan halaman ini.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
